name: Build ZMK firmware
run-name: "Firmware: ${{ github.event.head_commit.message || github.event.pull_request.title || github.event_name }}"

on:
  # Skip the firmware build when only docs (keymap chart, README) or the
  # keymap-drawer data under keymap/ change.
  push:
    paths-ignore:
      - "docs/**"
      - "keymap/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "keymap/**"
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
